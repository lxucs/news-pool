[project]
name = "news-pool"
version = "0.1.0"
description = "news-pool：每天收新闻、写中文摘要、在浏览器里阅读的 agent skill"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py39"
# 排序 import 时把 `newsdigest` 和 `newsviewer` 算作本项目的包。
src = ["news-pool/scripts"]
extend-exclude = [
    "tests/fixtures",
    # 设计文档原样引用计划里的代码，ruff 会重排其中的 Python 代码块。
    "docs/design",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.9"
include = ["news-pool/scripts", "tests"]
exclude = ["tests/fixtures"]
extraPaths = ["news-pool/scripts", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["news-pool/scripts"]
testpaths = ["tests"]
